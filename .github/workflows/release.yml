name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run on squash-merge commits, skip release commits from this workflow
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] semantic-release pushes the release commit and tag,
        # so this checkout has to keep its credential.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install python-semantic-release
        run: uv pip install python-semantic-release --system

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: semantic-release version --changelog --push --tag --vcs-release
