name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run on squash-merge commits, skip release commits from this workflow
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] semantic-release pushes the release commit and tag,
        # so this checkout has to keep its credential.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install python-semantic-release
        run: uv pip install python-semantic-release --system

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: semantic-release version --changelog --push --tag --vcs-release
